# Example deployment: virtweb behind Traefik (v3) as an L4 (TCP)
# pass-through — the supported topology.
#
# Topology:
#
#   browser --TLS--> traefik :443 (raw TCP) -- virtweb :8443 (TLS/mTLS)
#
# Traefik forwards the raw TLS stream; virtweb terminates TLS (and,
# with -client-ca, mTLS) itself. There is no L7 layer in front of this
# app: no HTTP proxying, no basic auth at the edge — authentication is
# the client certificate, or the network the browser sits in (see the
# notes in README.md).
#
# Out of the box this stack runs as a local test: the committed
# self-signed certificate in ./certs/ (CN=virtweb.example.test) and
# -no-auth. For a real deployment:
#
#   - Replace `virtweb.example.test` (HostSNI router) with your real
#     hostname.
#   - Replace ./certs/tls.{crt,key} with a certificate issued for that
#     hostname (Let's Encrypt or any manual issuance) — the options
#     and the rotation procedure are in README.md ("Server
#     certificate").
#   - Swap -no-auth for -client-ca to enable mTLS (the production
#     authentication).
#
# The image is built from the repo (multi-stage Dockerfile at the repo
# root):   docker build -t virtweb .   (the build context is `../../`
# relative to this file)
#
# The data dir volume holds the server list and the per-server SSH
# credentials; it is the only state that must survive.

services:
  virtweb:
    image: virtweb:latest
    # build:
    #   context: ../../
    restart: unless-stopped
    # TLS is always served, and client auth is the default: virtweb
    # needs -client-ca (mTLS) or an explicit -no-auth. This local test
    # stack (throwaway certs) runs -no-auth; for production replace it
    # with -client-ca (client certificates then become required — that
    # is the authentication).
    command:
      - "-addr"
      - "0.0.0.0:8443"
      - "-tls-cert"
      - "/etc/virtweb/tls.crt"
      - "-tls-key"
      - "/etc/virtweb/tls.key"
      - "-no-auth"   # local-test default; production: -client-ca /etc/virtweb/client-ca.pem
      # - "-client-ca"
      # - "/etc/virtweb/client-ca.pem"
      # If you enable -proxy-protocol (Traefik can send the PROXY
      # header on TCP routers), name the proxy's source here — e.g.
      # the compose network's subnet — so a peer on the internal
      # network cannot forge it:
      # - "-proxy-protocol"
      # - "-proxy-from"
      # - "172.16.0.0/12"
    volumes:
      - virtweb-data:/home/virtweb/.virtweb
      - ./certs:/etc/virtweb:ro
    networks: [internal]
    labels:
      # exposedbydefault is false on traefik; opt in explicitly
      - "traefik.enable=true"
      # L4: a TCP router matches on the TLS SNI and forwards the raw
      # stream — no TLS termination, no HTTP, no buffering.
      - "traefik.tcp.routers.virtweb.rule=HostSNI(`virtweb.example.test`)"
      - "traefik.tcp.routers.virtweb.entrypoints=tcp"
      - "traefik.tcp.services.virtweb.loadbalancer.server.port=8443"

  traefik:
    image: docker.io/library/traefik:v3.7
    restart: unless-stopped
    ports:
      - "443:443"   # raw TCP to virtweb's TLS listener
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro   # provider: service discovery
    networks: [internal]
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.tcp.address=:443"

networks:
  internal:

volumes:
  virtweb-data:   # server list + per-server SSH credentials (mode 0600)
