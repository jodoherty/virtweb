# e2e fixture: HAProxy L4 (TCP pass-through) in front of virtweb —
# the plain-tcp analogue of the L4 pass-through deployment (no
# buffering to break; idle survival rides on virtweb's keepalives the
# same way as in L7 mode).
global
    log stdout format raw local0
defaults
    mode tcp
    timeout connect 5s
    timeout client 30s
    timeout server 30s
frontend ft
    bind :{{PROXY_PORT}}
    default_backend be
backend be
    server virtweb 127.0.0.1:{{BACKEND_PORT}}
