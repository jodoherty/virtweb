# e2e fixture: HAProxy L7 (HTTP) in front of virtweb.
#
# The point of this fixture is to prove the stream behaviour against a
# real proxy implementation:
#   - response bodies are passed through unbuffered (HAProxy does not
#     buffer by default — the "console drip" spec asserts the arrivals
#     are still spread in time, not one batch);
#   - idle streams survive the proxy's idle timeouts only because
#     virtweb's KEEPALIVE frames keep the stream busy (default
#     keepalive 15 s < the 30 s timeouts below).
global
    log stdout format raw local0
defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s
frontend ft
    bind :{{PROXY_PORT}}
    default_backend be
backend be
    server virtweb 127.0.0.1:{{BACKEND_PORT}}
