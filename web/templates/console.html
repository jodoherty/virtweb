{{define "console"}}
<header class="viewer-bar">
  <a class="viewer-back" href="/servers/{{.Server.ID}}">←</a>
  <h1>Console — <strong>{{.VM.Name}}</strong> <span class="muted">({{.VM.State}})</span></h1>
  <span class="viewer-tools">
    <span id="console-status" class="viewer-status muted">{{if not .Running}}This VM is {{.VM.State}} — start it first.{{else}}Connecting…{{end}}</span>
    <button id="console-reconnect" hidden>Reconnect</button>
    <button id="console-fullscreen" type="button">Fullscreen</button>
  </span>
</header>
<main id="console-main" class="viewer-main">
  <!-- The terminal fills this fixed area; status/errors live in the
       bar above, so nothing ever repositions it. -->
  {{if not .Running}}
  <div class="viewer-connect"><div class="viewer-card muted">
    This VM is {{.VM.State}} — <a href="/servers/{{.Server.ID}}/vms/{{.VM.Name}}">start it</a> to attach to the serial console.
  </div></div>
  {{else}}
  <div id="term" class="viewer-term"></div>
  <link rel="stylesheet" href="/xtermjs/css/xterm.css">
  <script src="/xtermjs/lib/xterm.js"></script>
  <script src="/xtermjs/addon-fit/lib/addon-fit.js"></script>
  {{end}}
  <script type="application/json" id="console-cfg">{{.CfgJSON}}</script>
  <script type="module" src="/static/console.js"></script>
</main>
{{end}}
