{{define "spice"}}
<p><a href="/servers/{{.Server.ID}}">←</a> SPICE — <strong>{{.VM.Name}}</strong>
  <span class="muted">({{.VM.State}})</span></p>
<form id="spice-form">
  <label>Address (host:port)
    <input name="address" size="18"
           value="{{if .VM.SpiceAddr}}{{.VM.SpiceAddr}}{{else}}127.0.0.1:5991{{end}}"></label>
  <label>Password <input name="password" type="password" size="20"></label>
  <button type="submit">Connect</button>
</form>
<p id="spice-status" class="muted">
  {{if not .Running}}This VM is {{.VM.State}} — start it first.{{end}}
  The address is the SPICE display (from <code>virsh domdisplay</code>);
  SPICE is often loopback-bound, so <code>127.0.0.1</code> means the
  server host itself.</p>
<button id="spice-reconnect" hidden>Reconnect</button>
<div id="spice-messages"></div>
<div id="spice" class="spice-frame"></div>
<link rel="stylesheet" href="/spice/spice.css">
<script type="application/json" id="spice-cfg">{{.CfgJSON}}</script>
<script type="module" src="/static/spice.js"></script>
{{end}}
